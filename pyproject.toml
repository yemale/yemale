[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yemale"
version = "0.1.0a1"
description = "Multivariate conformal prediction and predictive distributions via optimal transport"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Eugene Ndiaye", email = "yemaledev@gmail.com" }]
classifiers = ["Development Status :: 3 - Alpha"]
keywords = ["conformal prediction", "vector-valued scores", "predictive distributions", "optimal transport"]
dependencies = ["numpy>=1.24", "scipy>=1.10", "numba>=0.61,<0.68"]

[project.urls]
Homepage = "https://yemale.github.io/"
Repository = "https://github.com/yemale/yemale"

[project.optional-dependencies]
docs = ["sphinx>=8.2,<9", "myst-parser>=4,<5", "sphinx-book-theme>=1.1,<2"]

[tool.setuptools.packages.find]
where = ["src"]
