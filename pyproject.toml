[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yemale"
version = "0.1.0"
description = "Candidate-augmented transport between vector point clouds"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Eugene Ndiaye" }]
dependencies = ["numpy>=1.24", "scipy>=1.10", "numba>=0.61,<0.68"]

[project.optional-dependencies]
docs = ["sphinx>=8.2,<9", "myst-parser>=4,<5", "sphinx-book-theme>=1.1,<2"]

[tool.setuptools.packages.find]
where = ["src"]
